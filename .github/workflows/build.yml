name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      short: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - name: 检出全部历史
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          cache: false

      - name: 初始化 GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.8.x"
          nugetConfigPath: "${{ github.workspace }}/nuget.config"

      - name: 计算版本号
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: 生成版本文件
        shell: pwsh
        run: |-
          "<Project>" > Directory.Version.props
          "  <PropertyGroup>" >> Directory.Version.props
          "    <Version>${{ steps.gitversion.outputs.semVer }}</Version>" >> Directory.Version.props
          "    <VersionPrefix>${{ steps.gitversion.outputs.majorMinorPatch }}</VersionPrefix>" >> Directory.Version.props
          "    <VersionSuffix>${{ steps.gitversion.outputs.preReleaseTag }}</VersionSuffix>" >> Directory.Version.props
          "    <PackageVersion>${{ steps.gitversion.outputs.fullSemVer }}</PackageVersion>" >> Directory.Version.props
          "    <InformationalVersion>${{ steps.gitversion.outputs.informationalVersion }}</InformationalVersion>" >> Directory.Version.props
          "    <AssemblyVersion>${{ steps.gitversion.outputs.assemblySemVer }}</AssemblyVersion>" >> Directory.Version.props
          "    <FileVersion>${{ steps.gitversion.outputs.assemblySemFileVer }}</FileVersion>" >> Directory.Version.props
          "    <RepositoryBranch>${{ steps.gitversion.outputs.branchName }}</RepositoryBranch>" >> Directory.Version.props
          "    <RepositoryCommit>${{ steps.gitversion.outputs.sha }}</RepositoryCommit>" >> Directory.Version.props
          "  </PropertyGroup>" >> Directory.Version.props
          "</Project>" >> Directory.Version.props

          @"
          # 由 CI 生成，勿入库；native CMake 构建读取本文件（见 src/OBSharp.Interop.Native/CMakeLists.txt）。
          set(OBSHARP_VERSION "${{ steps.gitversion.outputs.semVer }}")
          set(OBSHARP_VERSION_NUMERIC "${{ steps.gitversion.outputs.majorMinorPatch }}")
          set(OBSHARP_VERSION_FILE "${{ steps.gitversion.outputs.assemblySemFileVer }}")
          "@ | Set-Content -Path Directory.Version.cmake -Encoding utf8

      - name: 还原 .NET 工具
        run: dotnet tool restore

      - name: 还原 .NET 项目
        run: |-
          dotnet restore OBSharp.slnx --graph --artifacts-path artifacts
          dotnet restore src/OBSharp.PluginManager --graph --artifacts-path artifacts

      # ── Interop 绑定生成：为什么必须现场生成、为什么不缓存产物 ─────────────────
      # Generated/ 在 .gitignore 里（绑定产物不入库），托管构建前必须先生成。生成依赖
      # 四样东西：
      #   * lib/obs-studio、lib/obs-browser 子模块 —— 解析闭包（checkout 的
      #     submodules: true 已带）；
      #   * CEF / Qt6 头文件 —— lib/deps 里的预编译包，由下面两步拉取（native job 用
      #     的同一套 cmake/ObSharpDeps.cmake，压缩包缓存 key 也与 native job 相同）；
      #   * MSVC 14.44 的 STL —— libclang 21 会被 MSVC 14.52 的 yvals_core.h 以
      #     STL1000 拒绝，生成器用 --msvc-include 钉旧工具集（runner 上要装 v14.44
      #     组件；见 src/OBSharp.Interop.Generator/README.md）；
      #   * libclang 原生库 —— ClangSharp 包自带，随生成器构建拷进输出目录。
      # 头文件取 x64 包：产物是 C# 源码，跟头文件属于哪个架构无关，arm64 那份不必再拉。
      # 取舍：不缓存 Generated/ —— 缓存 key 要覆盖「生成器源码 + 头文件 + 子模块版本」
      # 三者，漏算任何一个都会出脏产物；生成本身不到一分钟，比排查脏缓存便宜。也不把
      # 生成挪去 native job：它在 dotnet job 之后跑，而托管构建马上就要用产物。native /
      # bundle job 需要的 Generated/ 由「上传构建缓存」传下去，不重复生成。

      - name: 缓存原生依赖（CEF / Qt6 压缩包）
        uses: actions/cache@v6
        with:
          path: |
            lib/deps/*.zip
            lib/deps/*.tar.xz
          key: deps-${{ runner.os }}-x64-${{ hashFiles('lib/obs-studio/CMakePresets.json', 'cmake/ObSharpDeps.cmake') }}

      - name: 拉取绑定生成所需的 CEF / Qt6 头文件
        # 只为触发 cmake/ObSharpDeps.cmake 的下载 / 解压（配置期就拉依赖，不编译），
        # 跑完 lib/deps 里就有生成器要的头文件。真正编译 native 是 native job 的事。
        run: cmake --preset win-x64

      - name: 生成 Interop 绑定
        # 与本地同一条生成逻辑：调 Build-DevDist.ps1 的绑定生成步骤（-GeneratorOnly
        # 只跑到生成就结束），命令不在此复制第二份；生成器随用随编（dotnet run）。
        shell: pwsh
        run: ./scripts/Build-DevDist.ps1 -GeneratorOnly -Configuration Release -Framework net11.0

      # 下面的编译 / 发布链与 scripts/Build-DevDist.ps1 的⑤保持一致：解决方案两套 TFM
      # 一起编（插件管理器只有 net10.0，跟着宿主那份 -f 走会错），发布时各按各的 TFM。
      - name: 编译 .NET 项目
        run: dotnet build OBSharp.slnx --graph --artifacts-path artifacts --configuration Release --no-restore

      - name: 发布 Runtime
        run: dotnet publish src/OBSharp.Runtime --graph --artifacts-path artifacts --configuration Release --framework net11.0 --no-restore

      - name: 发布 PluginManager
        run: dotnet publish src/OBSharp.PluginManager --graph --artifacts-path artifacts --configuration Release --no-restore

      - name: 上传托管程序集
        uses: actions/upload-artifact@v7
        with:
          name: assemblies
          path: artifacts/publish/OBSharp.Runtime/release_net11.0/
          if-no-files-found: error

      - name: 上传 PluginManager 托管程序集
        uses: actions/upload-artifact@v7
        with:
          name: pluginmanager-assemblies
          path: artifacts/publish/OBSharp.PluginManager/release_net10.0/
          if-no-files-found: error

      - name: 上传构建缓存
        uses: actions/upload-artifact@v7
        with:
          name: build-cache
          path: |-
            Directory.Version.props
            Directory.Version.cmake
            artifacts/
            src/OBSharp.Interop/Generated/
          if-no-files-found: error

  native:
    name: Native (${{ matrix.rid }})
    needs: dotnet
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2025-vs2026
            rid: win-x64
            arch: x64
            outdir: x64

          - runs-on: windows-11-vs2026-arm
            rid: win-arm64
            arch: arm64
            outdir: arm64

          - runs-on: ubuntu-26.04
            rid: linux-x64
            arch: x86_64
            outdir: x64

          - runs-on: ubuntu-26.04-arm
            rid: linux-arm64
            arch: arm64
            outdir: arm64

          - runs-on: macos-26
            rid: osx-x64
            arch: x86_64
            outdir: x64

          - runs-on: macos-26
            rid: osx-arm64
            arch: arm64
            outdir: arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - name: 缓存原生依赖（CEF / Qt6 压缩包）
        uses: actions/cache@v6
        with:
          path: |
            lib/deps/*.zip
            lib/deps/*.tar.xz
          key: deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('lib/obs-studio/CMakePresets.json', 'cmake/ObSharpDeps.cmake') }}

      - name: 下载构建缓存
        uses: actions/download-artifact@v8
        with:
          name: build-cache
          path: .

      - name: 安装 Linux 构建依赖
        if: ${{ startsWith(matrix.runs-on, 'ubuntu-') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends `
            build-essential cmake ninja-build pkg-config clang zlib1g-dev `
            qt6-base-dev libgl1-mesa-dev libglvnd-dev `
            libx11-dev libx11-xcb-dev libxkbcommon-dev

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          cache: false

      - name: 配置 Native 项目
        run: cmake --preset ${{ matrix.rid }}

      - name: 编译 Native 项目
        run: cmake --build --preset ${{ matrix.rid }}-release

      - name: 还原 Loader 项目
        run: dotnet restore src/OBSharp.Loader --runtime ${{ matrix.rid }} --graph --artifacts-path artifacts

      - name: 编译 Loader 项目
        run: dotnet build src/OBSharp.Loader --runtime ${{ matrix.rid }} --graph --artifacts-path artifacts --configuration Release --framework net11.0 --no-restore

      - name: 以 NativeAOT 发布 Loader
        run: dotnet publish src/OBSharp.Loader --runtime ${{ matrix.rid }} --graph --artifacts-path artifacts --configuration Release --framework net11.0 --no-restore --no-build

      - name: 上传 Native 库
        uses: actions/upload-artifact@v7
        with:
          name: OBSharp.Interop.Native-${{ matrix.rid }}
          path: out/native/${{ matrix.outdir }}/Release/
          if-no-files-found: error

      - name: 上传 Loader 项目
        uses: actions/upload-artifact@v7
        with:
          name: OBSharp.Loader-${{ matrix.rid }}
          path: artifacts/publish/OBSharp.Loader/release_net11.0_${{ matrix.rid }}/
          if-no-files-found: error

  runtime:
    name: Package Runtime
    needs:
      - dotnet
      - native
    runs-on: ubuntu-26.04
    steps:
      - name: 下载程序集
        uses: actions/download-artifact@v8
        with:
          name: assemblies
          path: out/

      - name: 下载 Native 库 (win-x64)
        uses: actions/download-artifact@v8
        with:
          name: OBSharp.Interop.Native-win-x64
          path: out/runtimes/win-x64/native

      - name: 下载 Native 库 (win-arm64)
        uses: actions/download-artifact@v8
        with:
          name: OBSharp.Interop.Native-win-arm64
          path: out/runtimes/win-arm64/native

      - name: 下载 Native 库 (linux-x64)
        uses: actions/download-artifact@v8
        with:
          name: OBSharp.Interop.Native-linux-x64
          path: out/runtimes/linux-x64/native

      - name: 下载 Native 库 (linux-arm64)
        uses: actions/download-artifact@v8
        with:
          name: OBSharp.Interop.Native-linux-arm64
          path: out/runtimes/linux-arm64/native

      - name: 下载 Native 库 (osx-x64)
        uses: actions/download-artifact@v8
        with:
          name: OBSharp.Interop.Native-osx-x64
          path: out/runtimes/osx-x64/native

      - name: 下载 Native 库 (osx-arm64)
        uses: actions/download-artifact@v8
        with:
          name: OBSharp.Interop.Native-osx-arm64
          path: out/runtimes/osx-arm64/native

      - name: 上传完整程序集
        uses: actions/upload-artifact@v7
        with:
          name: runtime
          path: out/
          if-no-files-found: error

  bundle:
    name: Bundle
    needs:
      - dotnet
      - native
      - runtime
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            loader: OBSharp/bin/64bit/
            assemblies: OBSharp/bin/any/
            data: OBSharp/data/
          - rid: win-arm64
            loader: OBSharp/bin/64bit/
            assemblies: OBSharp/bin/any/
            data: OBSharp/data/
          - rid: linux-x64
            loader: OBSharp/bin/64bit/
            assemblies: OBSharp/bin/any/
            data: OBSharp/data/
          - rid: linux-arm64
            loader: OBSharp/bin/64bit/
            assemblies: OBSharp/bin/any/
            data: OBSharp/data/
          - rid: osx-x64
            loader: OBSharp.plugin/Contents/MacOS/
            assemblies: OBSharp.plugin/Contents/any/
            data: OBSharp.plugin/Contents/Resources/
          - rid: osx-arm64
            loader: OBSharp.plugin/Contents/MacOS/
            assemblies: OBSharp.plugin/Contents/any/
            data: OBSharp.plugin/Contents/Resources/
    steps:
      - name: 检出 data 目录
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |-
            src/OBSharp.Runtime/Data

      - name: 下载运行时程序集
        uses: actions/download-artifact@v8
        with:
          name: runtime
          path: out/${{ matrix.assemblies }}

      - name: 下载插件管理器程序集
        uses: actions/download-artifact@v8
        with:
          name: pluginmanager-assemblies
          path: out/${{ matrix.assemblies }}/OBSharp.PluginManager/

      - name: 下载 OB# 加载器
        uses: actions/download-artifact@v8
        with:
          name: OBSharp.Loader-${{ matrix.rid }}
          path: out/${{ matrix.loader }}

      - name: 复制 data
        shell: pwsh
        run: |-
          $source = "src/OBSharp.Runtime/Data/*"
          $destination = New-Item -ItemType Directory -Force -Path "out/${{ matrix.data }}"
          Copy-Item -Path $source -Destination $destination -Recurse -Force

      - name: 创建 macOS 插件包 Info.plist
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        shell: pwsh
        run: |-
          @'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>OB♯</string>
            <key>CFBundleExecutable</key>
            <string>OBSharp</string>
            <key>CFBundleIdentifier</key>
            <string>dev.shimakaze.obsharp</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>OBSharp</string>
            <key>CFBundlePackageType</key>
            <string>BNDL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ needs.dotnet.outputs.version }}</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
              <string>MacOSX</string>
            </array>
            <key>CFBundleVersion</key>
            <string>${{ needs.dotnet.outputs.short }}</string>
          </dict>
          </plist>
          '@ | Out-File -FilePath "out/OBSharp.plugin/Contents/Info.plist" -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: OBSharp-${{ matrix.rid }}
          path: out/
          if-no-files-found: error
